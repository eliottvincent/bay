<header class="site-header">
  <div class="wrapper">
    <a class="site-header__title" href="{{ "/" | relative_url }}">
      <img src="{{ "/assets/img/title.png" | relative_url }}" alt="{{ site.title }}" />
    </a>

    <nav class="site-nav">
      <a href="#" class="site-nav__toggle" data-js="menu-toggle" aria-label="Toggle navigation"></a>

      <div class="site-nav__menu" data-js="menu">
        {% for page in site.header.pages %}
          {% if page.slug and page.slug != "" and page.slug != nil %}
            {% assign page_link = page.slug %}
          {% else %}
            {% assign page_link = "/" | append: page.name | downcase %}
          {% endif %}
          {% assign page_link = page_link | relative_url %}
          <a class="site-nav__link" href="{{ page_link }}">
            {{- page.name -}}
          </a>
        {% endfor %}
      </div>
    </nav>
  </div>
</header>
